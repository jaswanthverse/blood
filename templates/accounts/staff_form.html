{% extends "base.html" %}
{% block title %}Add Staff{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="panel">
      <h5 class="fw-bold mb-3">New Staff Account</h5>
      <form method="post">
        {% csrf_token %}
        {% for field in form %}
          <div class="mb-3">
            <label class="form-label small fw-semibold">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}<div class="text-danger small mt-1">{{ field.errors|striptags }}</div>{% endif %}
          </div>
        {% endfor %}
        <button type="submit" class="btn btn-danger w-100">Create Account</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
