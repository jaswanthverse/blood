{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · Blood Bank System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <div class="text-center mb-4">
        <span class="brand-mark" style="background:#fee2e2;color:#b91c1c;font-size:1.4rem;width:48px;height:48px;border-radius:12px;">+</span>
        <h4 class="mt-3 mb-0 fw-bold">Blood Bank System</h4>
        <p class="text-muted small">Sign in to manage inventory</p>
    </div>
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} py-2">{{ message }}</div>
      {% endfor %}
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label small fw-semibold">Username</label>
        {{ form.username }}
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold">Password</label>
        {{ form.password }}
      </div>
      <button type="submit" class="btn btn-danger w-100 py-2 fw-semibold">Sign in</button>
    </form>
  </div>
</div>
</body>
</html>
