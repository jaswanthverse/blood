{% extends "base.html" %}
{% block title %}Issue {{ unit.unit_id }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="panel">
      <h5 class="fw-bold mb-1">Issue {{ unit.unit_id }}</h5>
      <p class="text-muted small mb-3">Reserved for {{ unit.reservation.patient_name }}</p>
      <form method="post">
        {% csrf_token %}
        {% for field in form %}
          <div class="mb-3">
            <label class="form-label small fw-semibold">{{ field.label }}</label>
            {{ field }}
          </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary w-100">Confirm Issue</button>
        <a href="{% url 'inventory:unit_detail' unit.pk %}" class="btn btn-link w-100 mt-1">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
