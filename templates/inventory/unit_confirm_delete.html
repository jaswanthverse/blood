{% extends "base.html" %}
{% block title %}Delete {{ unit.unit_id }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5">
    <div class="panel text-center">
      <h5 class="fw-bold mb-2">Delete {{ unit.unit_id }}?</h5>
      <p class="text-muted small mb-4">This permanently removes the unit and any reservation/issue history tied to it.</p>
      <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger w-100">Yes, Delete</button>
        <a href="{% url 'inventory:unit_detail' unit.pk %}" class="btn btn-link w-100 mt-1">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
