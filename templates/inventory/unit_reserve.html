{% extends "base.html" %}
{% block title %}Reserve {{ unit.unit_id }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="panel">
      <h5 class="fw-bold mb-1">Reserve {{ unit.unit_id }}</h5>
      <p class="text-muted small mb-3">{{ unit.blood_group }} · {{ unit.get_component_type_display }}</p>
      <form method="post">
        {% csrf_token %}
        {% for field in form %}
          <div class="mb-3">
            <label class="form-label small fw-semibold">{{ field.label }}</label>
            {{ field }}
          </div>
        {% endfor %}
        <button type="submit" class="btn btn-warning w-100">Confirm Reservation</button>
        <a href="{% url 'inventory:unit_detail' unit.pk %}" class="btn btn-link w-100 mt-1">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
